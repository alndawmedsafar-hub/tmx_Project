<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX KURDISH | Online Game</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0c0c0c; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .header { background-color: #ff0000; padding: 15px; font-size: 20px; font-weight: bold; }
        .brand { color: #1db954; font-size: 35px; text-shadow: 0 0 10px #1db954; margin: 20px 0; }
        .btn { background-color: #1db954; color: white; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin: 10px; }
        #game-area, #leaderboard-area { display: none; padding: 20px; }
        .player-entry { background: #222; margin: 5px; padding: 10px; border-radius: 10px; border-right: 5px solid gold; }
    </style>
</head>
<body>

    <div class="header">🎬 TMX KURDISH ENTERTAINMENT</div>
    
    <div id="login-area">
        <h1 class="brand">TMX KURDISH</h1>
        <input type="text" id="player-name" placeholder="ناوەکەت بنووسە..." style="padding: 10px; border-radius: 5px; border: none; width: 200px;"><br>
        <button class="btn" onclick="enterGame()">چوونە ناو یاری</button>
    </div>

    <div id="game-area">
        <h2 id="welcome-msg"></h2>
        <div style="font-size: 25px; color: gold; margin: 20px;">خاڵەکانت: <span id="current-score">0</span></div>
        <button class="btn" onclick="playTurn()">🎲 یاری بکە</button>
        <button class="btn" style="background: gray;" onclick="showLeaderboard()">📊 TOP 50</button>
    </div>

    <div id="leaderboard-area">
        <h2 style="color: gold;">🏆 TOP 50 PLAYERS</h2>
        <div id="top-list">بارگاوی دەبێتەوە...</div>
        <button class="btn" onclick="backToGame()">گەرانەوە</button>
    </div>

    <script>
        // بەستنەوە بە Firebase ەکەی تۆوە
        const firebaseConfig = {
            databaseURL: "https://tmx-kurdish-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let pName = "";
        let score = 0;

        function enterGame() {
            pName = document.getElementById('player-name').value;
            if(pName.length < 3) { alert("ناوەکەت زۆر کورتە!"); return; }
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('welcome-msg').innerText = "بەخێربێیت " + pName;
        }

        function playTurn() {
            let win = Math.floor(Math.random() * 50);
            score += win;
            document.getElementById('current-score').innerText = score;
            // پاشەکەوتکردن لە سێرڤەر
            database.ref('players/' + pName).set({ name: pName, score: score });
        }

        function showLeaderboard() {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('leaderboard-area').style.display = 'block';
            
            database.ref('players').orderByChild('score').limitToLast(50).on('value', (snapshot) => {
                let html = "";
                let arr = [];
                snapshot.forEach(child => arr.push(child.val()));
                arr.reverse().forEach((p, i) => {
                    html += `<div class="player-entry">${i+1}. ${p.name} — ${p.score} خاڵ</div>`;
                });
                document.getElementById('top-list').innerHTML = html;
            });
        }

        function backToGame() {
            document.getElementById('leaderboard-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
        }
    </script>
</body>
</html>
