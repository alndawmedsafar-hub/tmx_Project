<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biner Project | پڕۆژەی بینەر</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; text-align: center; direction: rtl; padding: 50px; }
        .container { border: 2px solid #38bdf8; padding: 30px; border-radius: 20px; box-shadow: 0 0 20px #38bdf8; display: inline-block; }
        h1 { color: #38bdf8; font-size: 3rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #94a3b8; }
        .status { background: #1e293b; padding: 10px; border-radius: 10px; margin-top: 20px; }
        .tag { color: #f472b6; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BINER</h1>
        <p>بەخێربێن بۆ جیهانی <span class="tag">Biner</span></p>
        <div class="status">
            <p>ئەم سایتە ئێستا لەسەر مۆبایلی <b>Honor X9c</b> بە شێوەی جیهانی کار دەکات.</p>
        </div>
        <p>داهاتوو لێرەوە دەست پێ دەکات...</p>
    </div>
</body>
</html>
