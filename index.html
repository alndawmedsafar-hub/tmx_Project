<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX CINEMA | BENAR MOVIES</title>
    <style>
        /* ڕێکخستنی گشتی لاپەڕە */
        body { 
            background-color: #050505; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* بەشی سەردێڕی سوور */
        header { 
            width: 100%; 
            background: #e50914; 
            padding: 20px 0; 
            text-align: center; 
            font-size: 24px; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            letter-spacing: 2px;
        }
        
        /* چوارچێوەی فیلمەکە */
        .container { 
            width: 95%; 
            max-width: 900px; 
            margin: 30px auto; 
            background: #111; 
            position: relative; /* بۆ ئەوەی لۆگۆکە لەسەری دابنیشێت */
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* بەشی پلەیەری ڤیدیۆ */
        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0; 
            overflow: hidden;
        }
        .video-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        /* 🚩 لۆگۆی BENAR - ڕێکخراوە بۆ وپەڕی سووچی لای چەپ */
        .tmx-logo {
            position: absolute;
            top: 5px;    /* کەمێک مەودا لە سەرەوە */
            left: 5px;   /* 👈 ئەمە دەیبات بۆ وپەڕی لای چەپ بۆ داپۆشینی لۆگۆی تر */
            width: 110px; /* قەبارەی لۆگۆکەت */
            height: auto;
            z-index: 9999; /* دڵنیایی دەدات کە لەسەرەوەیە */
            pointer-events: none; /* ڕێگری لە کلیک نەکات لەسەر ڤیدیۆکە */
            filter: drop-shadow(0 0 10px rgba(0,0,0,1)); /* بۆ ئەوەی جوانتر دیار بێت */
        }

        /* بەشی وردەکارییەکانی فیلم */
        .details { 
            padding: 25px; 
            border-top: 3px solid #e50914; 
            background: #161616; 
        }
        h1 { 
            color: #f1c40f; 
            font-size: 22px; 
            margin: 0 0 10px 0; 
            text-align: right; 
        }
        p { 
            color: #bbb; 
            font-size: 15px; 
            margin: 0; 
            text-align: right; 
            line-height: 1.6;
        }
    </style>
