<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>TMX MASTER UNIVERSE</title>
    <style>
        :root { --neon: #00ff41; --accent: #bc13fe; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; overflow: hidden; }
        .desktop { display: flex; flex-wrap: wrap; gap: 30px; padding: 40px; }
        .icon { width: 100px; text-align: center; cursor: pointer; transition: 0.3s; }
        .icon:hover { transform: scale(1.1); filter: drop-shadow(0 0 15px var(--accent)); }
        .icon span { font-size: 50px; display: block; margin-bottom: 5px; }
        .window { position: absolute; width: 90%; height: 85%; background: rgba(0,0,0,0.95); border: 2px solid var(--accent); border-radius: 12px; display: none; flex-direction: column; top: 5%; left: 5%; z-index: 100; box-shadow: 0 0 50px rgba(188,19,254,0.4); }
        .win-head { background: var(--accent); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; font-weight: bold; align-items: center; }
        .win-body { flex: 1; padding: 25px; overflow-y: auto; text-align: left; direction: ltr; background: #000; }
        .line { display: flex; border-bottom: 1px solid #111; padding: 4px 0; font-size: 14px; }
        .ln { color: #444; width: 50px; border-right: 1px solid #222; margin-right: 15px; flex-shrink: 0; }
        code { color: var(--neon); font-weight: bold; }
        .cmt { color: #666; margin-left: 15px; font-style: italic; }
        .term-container { position: fixed; bottom: 20px; width: 94%; left: 3%; z-index: 50; border: 1px solid var(--neon); border-radius: 8px; overflow: hidden; }
        #output { height: 180px; background: #000; padding: 15px; overflow-y: auto; border-bottom: 1px solid #222; font-size: 15px; }
        .input-area { background: #111; padding: 12px; display: flex; align-items: center; }
        #cmd-in { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-family: monospace; font-size: 17px; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="desktop">
        <div class="icon" onclick="openWin('core')"><span>🌀</span><p>Core Sys</p></div>
        <div class="icon" onclick="openWin('hack')"><span>💀</span><p>Hacking</p></div>
        <div class="icon" onclick="checkOffice()"><span>👑</span><p>TMX_OFFICE</p></div>
    </div>

    <div id="main-win" class="window">
        <div class="win-head"><span id="win-title">SYSTEM_EXPLORER</span><span style="cursor:pointer" onclick="closeWin()">✕</span></div>
        <div class="win-body" id="content-area"></div>
    </div>

    <div class="term-container">
        <div id="output">Welcome TMX... Type 'help' to start.</div>
        <div class="input-area">
            <span style="color:var(--neon)">tmx@honor-x9c:~$</span>
            <input type="text" id="cmd-in" onkeypress="handleCommand(event)" autofocus>
        </div>
    </div>

    <script>
        const PASS = "2010aa";

        // لیستی فەرمانە ڕاستەقینەکان بۆ ئەوەی هەموی وەک یەک نەبێت
        const realCore = ["apt update", "pkg install python", "termux-setup-storage", "pkg install git", "pkg install wget", "pkg install curl", "pkg install php", "pkg install nano", "pkg install ruby", "pkg install clang"];
        const realHack = ["nmap -v", "sqlmap --wizard", "msfconsole", "pkg install hydra", "pkg install tshark", "git clone https://github.com/sqlmapproject/sqlmap", "pkg install nikto", "bettercap -iface wlan0"];

        function openWin(mode) {
            const win = document.getElementById('main-win');
            const body = document.getElementById('content-area');
            win.style.display = 'flex';
            document.getElementById('win-title').innerText = "TMX " + mode.toUpperCase() + " REPOSITORY";
            
            let html = "";
            let dataList = (mode === 'core') ? realCore : (mode === 'hack') ? realHack : ["tmx --admin", "proxychains4", "openssl genrsa"];

            for(let i=1; i<=1500; i++) {
                // ئەگەر لەناو لیستە ڕاستەقینەکەدا هەبوو بەکاری بهێنە، ئەگەر نا دانەی ئۆتۆماتیکی دروست بکە
                let cmdLine = (i <= dataList.length) ? dataList[i-1] : (mode === 'core' ? `pkg install lib-module-0${i}` : `git clone tmx/exploit-v${i}`);
                let descLine = (mode === 'core') ? "سیستەمی تێرمۆکس" : (mode === 'hack') ? "ئامرازی هاکینگ" : "سکرێپتی ڤی ئای پی";
                
                html += `<div class="line"><span class="ln">${i}</span><code>${cmdLine}</code><span class="cmt">// ${descLine} - دێڕی ${i}</span></div>`;
            }
            body.innerHTML = html;
        }

        function closeWin() { document.getElementById('main-win').style.display = 'none'; }
        function checkOffice() { if(prompt("ACCESS KEY:") === PASS) openWin('office'); else alert("WRONG KEY!"); }

        function handleCommand(e) {
            if(e.key === "Enter") {
                const out = document.getElementById('output');
                const inp = document.getElementById('cmd-in');
                out.innerHTML += `<br>> ${inp.value}`;
                if(inp.value.toLowerCase() === "help") out.innerHTML += "<br>Try: nmap, whoami, clear";
                else if(inp.value.toLowerCase() === "whoami") out.innerHTML += "<br>TMX_Commander_HonorX9c";
                else if(inp.value.toLowerCase() === "clear") out.innerHTML = "Cleared.";
                else out.innerHTML += `<br>Processing command... Done.`;
                inp.value = "";
                out.scrollTop = out.scrollHeight;
            }
        }
    </script>
</body>
</html>
