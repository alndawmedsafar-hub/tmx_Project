<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>TMX ULTIMATE UNIVERSE</title>
    <style>
        :root { --neon: #00ff41; --accent: #bc13fe; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* Desktop Style */
        .desktop { display: flex; flex-wrap: wrap; gap: 30px; padding: 40px; }
        .icon { width: 100px; text-align: center; cursor: pointer; transition: 0.3s; }
        .icon:hover { transform: scale(1.1); filter: drop-shadow(0 0 15px var(--accent)); }
        .icon span { font-size: 50px; display: block; margin-bottom: 5px; }

        /* Window Style */
        .window { 
            position: absolute; width: 90%; height: 85%; background: rgba(0,0,0,0.95); 
            border: 2px solid var(--accent); border-radius: 12px; display: none; 
            flex-direction: column; top: 5%; left: 5%; z-index: 100; box-shadow: 0 0 50px rgba(188,19,254,0.4);
        }
        .win-head { background: var(--accent); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; font-weight: bold; align-items: center; }
        .win-body { flex: 1; padding: 25px; overflow-y: auto; text-align: left; direction: ltr; background: #000; }
        .close-btn { cursor: pointer; font-size: 24px; font-weight: bold; }

        /* 1500 Lines Style */
        .line { display: flex; border-bottom: 1px solid #111; padding: 4px 0; font-size: 14px; }
        .ln { color: #444; width: 50px; border-right: 1px solid #222; margin-right: 15px; flex-shrink: 0; }
        code { color: var(--neon); font-weight: bold; }
        .cmt { color: #666; margin-left: 15px; font-style: italic; }

        /* Terminal Style */
        .term-container { position: fixed; bottom: 20px; width: 94%; left: 3%; z-index: 50; border: 1px solid var(--neon); border-radius: 8px; overflow: hidden; }
        #output { height: 180px; background: #000; padding: 15px; overflow-y: auto; border-bottom: 1px solid #222; font-size: 15px; }
        .input-area { background: #111; padding: 12px; display: flex; align-items: center; }
        #cmd-in { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-family: monospace; font-size: 17px; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="desktop">
        <div class="icon" onclick="openWin('core')"><span>🌀</span><p>Core Sys</p></div>
        <div class="icon" onclick="openWin('hack')"><span>💀</span><p>Hacking</p></div>
        <div class="icon" onclick="checkOffice()"><span>👑</span><p>TMX_OFFICE</p></div>
    </div>

    <div id="main-win" class="window">
        <div class="win-head">
            <span id="win-title">SYSTEM_EXPLORER</span>
            <span class="close-btn" onclick="closeWin()">✕</span>
        </div>
        <div class="win-body" id="content-area"></div>
    </div>

    <div class="term-container">
        <div id="output">Welcome Commander TMX to Terminal 1.0... Type 'help' to see commands.</div>
        <div class="input-area">
            <span style="color:var(--neon)">tmx@honor-x9c:~$</span>
            <input type="text" id="cmd-in" onkeypress="handleCommand(event)" autofocus>
        </div>
    </div>

    <script>
        const PASS = "2010aa";

        function openWin(mode) {
            const win = document.getElementById('main-win');
            const title = document.getElementById('win-title');
            const body = document.getElementById('content-area');
            
            win.style.display = 'flex';
            title.innerText = "TMX " + mode.toUpperCase() + " REPOSITORY (1500 LINES)";
            
            // دروستکردنی ١٥٠٠ دێڕ بە یەک چرکە
            let html = "";
            for(let i=1; i<=1500; i++) {
                let cmd = (mode === 'core') ? `pkg install tmx-core-v${i}` : (mode === 'hack') ? `git clone tmx/tool-${i}` : `tmx-vip-execute --id-${i}`;
                let desc = (mode === 'core') ? "سیستەم" : (mode === 'hack') ? "هاکینگ" : "سکرێپتی نهێنی";
                html += `<div class="line"><span class="ln">${i}</span><code>${cmd}</code><span class="cmt">// فەرمانی ${desc} ئاستی ${i}</span></div>`;
            }
            body.innerHTML = html;
        }

        function closeWin() { document.getElementById('main-win').style.display = 'none'; }

        function checkOffice() {
            let key = prompt("TMX MASTER ACCESS KEY:");
            if(key === PASS) { openWin('office'); }
            else { alert("ACCESS DENIED! Invalid Key."); }
        }

        // مێشکی تێرمیناڵەکە
        function handleCommand(e) {
            if(e.key === "Enter") {
                const out = document.getElementById('output');
                const inp = document.getElementById('cmd-in');
                const val = inp.value.toLowerCase().trim();
                
                out.innerHTML += `<br><span style="color:#aaa;">> ${val}</span>`;
                
                if(val === "help") {
                    out.innerHTML += "<br>Commands: <span style='color:yellow'>nmap, whoami, clear, pkg install, tmx-status</span>";
                } else if(val === "whoami") {
                    out.innerHTML += "<br>Commander_TMX_Official_HonorX9c";
                } else if(val === "clear") {
                    out.innerHTML = "Terminal screen cleared.";
                } else if(val === "tmx-status") {
                    out.innerHTML += "<br>CPU: Ultra | RAM: Stable | Target: Secure";
                } else if(val.startsWith("pkg install")) {
                    out.innerHTML += `<br>Downloading package... [##########] 100% Complete.`;
                } else {
                    out.innerHTML += `<br><span style="color:red;">Error: Command '${val}' not recognized.</span>`;
                }
                
                inp.value = "";
                out.scrollTop = out.scrollHeight;
            }
        }
    </script>
</body>
</html>
