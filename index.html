<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX MOVIE DUBBING FACTORY</title>
    <style>
        :root { --main: #e50914; --bg: #000000; --neon: #00ff41; --gold: #ffd700; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Header Section */
        header { background: linear-gradient(to bottom, rgba(229, 9, 20, 0.3), transparent); padding: 40px; text-align: center; border-bottom: 2px solid var(--main); }
        .logo { font-size: 3rem; font-weight: bold; color: var(--main); text-shadow: 0 0 20px var(--main); letter-spacing: 5px; }

        /* Working Area */
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 30px; }
        
        /* Video Player Box */
        .video-box { background: #111; border: 2px dashed #444; border-radius: 15px; height: 400px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .video-box:hover { border-color: var(--neon); }

        /* Control Panel */
        .panel { background: #181818; padding: 25px; border-radius: 15px; border: 1px solid #333; }
        h3 { color: var(--gold); border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .btn { background: var(--main); color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px; transition: 0.3s; }
        .btn:hover { background: #ff1f1f; transform: scale(1.02); }
        .btn-neon { background: transparent; border: 1px solid var(--neon); color: var(--neon); }
        .btn-neon:hover { background: var(--neon); color: black; }

        /* Status Log */
        .log { background: #000; border: 1px solid #222; height: 150px; padding: 10px; font-family: monospace; font-size: 13px; color: var(--neon); overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>

<header>
    <div class="logo">TMX MOVIE FACTORY</div>
    <p>سیستەمی هۆشمەندی دۆبلاژ و بەرزکردنەوەی کوالێتی فیلم</p>
</header>

<div class="container">
    <div class="main-side">
        <div class="video-box" id="drop-zone">
            <div id="status-text">ڤیدیۆکە لێرە دابنێ (Drag & Drop) یان کلیک بکە</div>
        </div>
        
        <div class="log" id="log-screen">
            [SYSTEM]: ئامادەیە بۆ وەرگرتنی فیلم...<br>
            [INFO]: پڕۆسێسەری Honor X9c چالاکە...
        </div>
    </div>

    <div class="panel">
        <h3>کۆنتڕۆڵی دۆبلاژ</h3>
        <button class="btn" onclick="startProcess('dub')">دەستپێکردنی دۆبلاژی کوردی</button>
        <button class="btn btn-neon" onclick="startProcess('4k')">بەرزکردنەوەی کوالێتی (4K)</button>
        
        <h3>ڕێکخستنەکان</h3>
        <label>زمانی سەرەکی:</label>
        <select style="width:100%; padding:10px; margin-bottom:15px; background:#333; color:white; border:none;">
            <option>ئینگلیزی (English)</option>
            <option>عەرەبی (Arabic)</option>
            <option>تورکی (Turkish)</option>
        </select>

        <label>جۆری دەنگی دۆبلاژ:</label>
        <select style="width:100%; padding:10px; margin-bottom:15px; background:#333; color:white; border:none;">
            <option>دەنگی پیاو (کوردی AI)</option>
            <option>دەنگی ئافرەت (کوردی AI)</option>
        </select>

        <button class="btn" style="background:var(--gold); color:black;" onclick="downloadVideo()">داگرتنی فیلمی کۆتایی</button>
    </div>
</div>

<script>
    function startProcess(type) {
        const log = document.getElementById('log-screen');
        if(type === 'dub') {
            log.innerHTML += "<br>[DUB]: خەریکی جیاکردنەوەی دەنگم...";
            setTimeout(() => { log.innerHTML += "<br>[DUB]: وەرگێڕان بۆ کوردی تەواو بوو."; }, 2000);
            setTimeout(() => { log.innerHTML += "<br>[DUB]: دەنگی نوێ لکێندرا بە ڤیدیۆکە."; }, 4000);
        } else {
            log.innerHTML += "<br>[VIDEO]: خەریکی بەرزکردنەوەی ڕوونی (Frame Reconstruction)...";
            setTimeout(() => { log.innerHTML += "<br>[VIDEO]: کوالێتی گۆڕدرا بۆ 2160p (4K)."; }, 3000);
        }
    }

    function downloadVideo() {
        alert("فەرماندە، ڤیدیۆکە ئامادەیە و خەریکە دادەبەزێت!");
    }
</script>

</body>
</html>
