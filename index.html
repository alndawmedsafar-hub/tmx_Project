<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX CINEMA | BENAR MOVIES</title>
    <style>
        /* ڕێکخستنی بنەڕەتی */
        body { 
            background-color: #050505; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        header { 
            width: 100%; 
            background: #e50914; 
            padding: 15px 0; 
            text-align: center; 
            font-size: 18px; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        
        /* چوارچێوەی سەرەکی کە شاشەکە پڕ دەکاتەوە */
        .main-container {
            width: 100%; /* بۆ مۆبایل شاشەکە پڕ دەکات */
            max-width: 900px; /* بۆ کۆمپیوتەر زیاد لە پێویست پان نابێت */
            margin: 10px auto;
            position: relative;
        }

        /* پلەیەرەکە کە بەقەد شاشەکە پان دەبێتەوە */
        .video-box {
            width: 100%;
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 🚩 لۆگۆکە - ئێستا لە مۆبایلیشدا بە ڕوونی دیارە */
        .tmx-logo {
            position: absolute !important;
            top: 5px !important;
            left: 5px !important;
            width: 18% !important; /* قەبارەکەی بەپێی شاشەکە دەگۆڕێت */
            max-width: 80px; /* زیاد لە پێویست گەورە نابێت */
            min-width: 50px; /* زیاد لە پێویست بچووک نابێت */
            height: auto;
            z-index: 999999 !important;
            pointer-events: none;
            filter: drop-shadow(0 0 5px rgba(0,0,0,1));
        }

        .details { 
            background: #111; 
            padding: 15px; 
            margin: 10px;
            border-radius: 8px; 
            text-align: right; 
            border-right: 4px solid #e50914;
        }

        h1 { color: #f1c40f; font-size: 18px; margin: 0; }
        p { color: #bbb; font-size: 14px; margin-top: 8px; }

        /* ڕێکخستن بۆ کۆمپیوتەر */
        @media (min-width: 768px) {
            header { font-size: 24px; }
            .main-container { margin: 30px auto; }
        }
    </style>
</head>
<body>

    <header>🍿 TMX TERMINAL CINEMA</header>

    <div class="main-container">
        <img src="logo.png" class="tmx-logo" alt="BENAR">

        <div class="video-box">
            <iframe src="https://drive.google.com/file/d/1Gku45kUBjEAUtOiy5h5FGQvR1uSokUz3/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <div class="details">
            <h1>The Skeleton's Compass 🎬 (2022)</h1>
            <p>بەخێربێن بۆ سینەمای BENAR MOVIES.</p>
        </div>
    </div>

</body>
</html>
