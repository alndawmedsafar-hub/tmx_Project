<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX CINEMA | BENAR MOVIES</title>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background: #e50914; padding: 20px 0; text-align: center; font-size: 24px; font-weight: bold; }
        
        .container { 
            width: 95%; 
            max-width: 900px; 
            margin: 30px auto; 
            background: #111; 
            position: relative; 
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 🚩 لۆگۆی BENAR لە سووچی سەرەوە لای چەپ */
        .tmx-logo {
            position: absolute;
            top: 10px;    /* مەودا لە سەرەوە */
            left: 10px;   /* مەودا لە لای چەپ */
            width: 125px; /* قەبارەکەی لێرە گەورەتر بکە ئەگەر پێویست بوو بۆ داپۆشین */
            height: auto;
            z-index: 999;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(0,0,0,1));
        }

        .details { padding: 20px; border-top: 3px solid #e50914; background: #161616; }
        h1 { color: #f1c40f; font-size: 22px; }
    </style>
</head>
<body>

    <header>🍿 TMX TERMINAL CINEMA</header>

    <div class="container">
        <img src="benar_logo.png" class="tmx-logo" alt="BENAR MOVIES">

        <div class="video-container">
            <iframe src="https://drive.google.com/file/d/1Gku45kUBjEAUtOiy5h5FGQvR1uSokUz3/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <div class="details">
            <h1>The Skeleton's Compass (2022) 🎬</h1>
            <p>بەخێربێن بۆ سینەمای BENAR MOVIES. پەخشی تایبەتی فەرماندە TMX بە لۆگۆی نوێوە.</p>
        </div>
    </div>

</body>
</html>
