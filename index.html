<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX CINEMA | The Skeleton's Compass</title>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background: #e50914; padding: 20px 0; text-align: center; font-size: 24px; font-weight: bold; }
        
        .container { 
            width: 95%; 
            max-width: 900px; 
            margin: 30px auto; 
            background: #111; 
            position: relative; /* بۆ ئەوەی لۆگۆکە لە ناو ئەم چوارچێوەیە بێت */
            border-radius: 10px;
            overflow: hidden;
        }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 🚩 لۆگۆی TMX بۆ داپۆشینی Kurd Subtitle */
        .tmx-logo {
            position: absolute;
            top: 10px;    /* لێرە بەرزی و نزمی ڕێکبخە */
            right: 10px;  /* ئەگەر لۆگۆی Kurd Subtitle لە لای ڕاستە، ئەمە وەک خۆی لێ بگەڕێ */
            /* left: 10px;  <- ئەگەر لە لای چەپ بوو، ئەوا right بسڕەوە و ئەمە بەکاربهێنە */
            width: 100px; /* قەبارەی لۆگۆکەت */
            z-index: 100;
            pointer-events: none;
        }

        .details { padding: 20px; border-top: 3px solid #e50914; }
        h1 { color: #f1c40f; font-size: 22px; }
    </style>
</head>
<body>

    <header>🍿 TMX TERMINAL CINEMA</header>

    <div class="container">
        <img src="لێرە_لینکی_وێنەی_لۆگۆکەت_دابنێ" class="tmx-logo" alt="TMX">

        <div class="video-container">
            <iframe src="https://drive.google.com/file/d/1Gku45kUBjEAUtOiy5h5FGQvR1uSokUz3/preview" allow="autoplay"></iframe>
        </div>

        <div class="details">
            <h1>The Skeleton's Compass (2022) 🎬</h1>
            <p>بەخێربێن بۆ پەخشی تایبەتی TMX. لۆگۆی سەر ڤیدیۆکە بە فەرمی گۆڕدرا بۆ TMX.</p>
        </div>
    </div>

</body>
</html>
