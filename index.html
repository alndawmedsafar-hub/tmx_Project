<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>TMX MULTI-CORE OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="desktop">
        <div class="icon" onclick="openWin('sys-win')"><span>⚙️</span><p>System</p></div>
        <div class="icon" onclick="openWin('hack-win')"><span>📡</span><p>Network</p></div>
        <div class="icon" onclick="checkOffice()"><span>🔐</span><p>Biner_Office</p></div>
    </div>

    <div id="sys-win" class="window"><div class="win-head">System Terminal <span onclick="closeWin('sys-win')">✕</span></div><div class="win-body" id="sys-data"></div></div>
    <div id="hack-win" class="window"><div class="win-head">Hacking Tools <span onclick="closeWin('hack-win')">✕</span></div><div class="win-body" id="hack-data"></div></div>
    <div id="office-win" class="window"><div class="win-head">Private Office <span onclick="closeWin('office-win')">✕</span></div><div class="win-body" id="office-data"></div></div>

    <script src="system.js"></script>
    <script src="hacking.js"></script>
    <script src="office.js"></script>
</body>
</html>
