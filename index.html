<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX CINEMA | BENAR MOVIES</title>
    <style>
        body { 
            background-color: #050505; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        header { 
            width: 100%; 
            background: #e50914; 
            padding: 15px 0; 
            text-align: center; 
            font-size: 18px; 
            font-weight: bold; 
        }
        
        .main-container {
            width: 100%;
            max-width: 900px;
            margin: 10px auto;
            position: relative;
        }

        .video-box {
            width: 100%;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            overflow: hidden;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 🚩 لۆگۆکە گەڕایەوە شوێنی ڕاستی خۆی بۆ داپۆشینی لۆگۆ کۆنەکە */
        .tmx-logo {
            position: absolute !important;
            top: 5px !important;    /* 👈 کەمێک هێنراوەتە خوارەوە بۆ دیقەت */
            left: 5px !important;   /* 👈 ڕێک لە سووچی لای چەپ */
            width: 65px !important; 
            height: auto;
            z-index: 999999 !important;
            pointer-events: none;
            filter: drop-shadow(0 0 5px rgba(0,0,0,1));
        }

        .details { 
            background: #111; 
            padding: 15px; 
            margin: 10px;
            border-radius: 8px; 
            text-align: right; 
            border-right: 4px solid #e50914;
        }

        h1 { color: #f1c40f; font-size: 18px; margin: 0; }
        p { color: #bbb; font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>

    <header>🍿 سینەما تی ئێم ئێکس تێرمینال</header>

    <div class="main-container">
        <div class="video-box">
            <img src="logo.png" class="tmx-logo" alt="BENAR">
            <iframe src="https://drive.google.com/file/d/1Gku45kUBjEAUtOiy5h5FGQvR1uSokUz3/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>

        <div class="details">
            <h1>The Skeleton's Compass 🎬 (2022)</h1>
            <p>بەخێربێن بۆ سینەمای BENAR MOVIES.</p>
        </div>
    </div>

</body>
</html>
