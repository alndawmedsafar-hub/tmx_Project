<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX KURDISH | Online</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        :root { --tmx-green: #1db954; --tmx-red: #ff0000; --tmx-gold: #ffd700; }
        body { background-color: #0c0c0c; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .header { background-color: var(--tmx-red); padding: 15px; font-size: 20px; font-weight: bold; }
        .tab-bar { display: flex; justify-content: space-around; background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; }
        .tab { cursor: pointer; color: #888; padding: 5px; }
        .tab.active { color: var(--tmx-green); border-bottom: 2px solid var(--tmx-green); }
        .game-container { display: none; padding: 20px; }
        .game-container.active { display: block; }
        .btn { background-color: var(--tmx-green); color: white; padding: 12px 25px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin: 10px; }
        .score-box { background: #222; margin: 5px auto; padding: 12px; border-radius: 8px; border-right: 4px solid var(--tmx-green); display: flex; justify-content: space-between; max-width: 350px; }
        input { padding: 12px; border-radius: 8px; border: none; width: 80%; max-width: 250px; margin-bottom: 15px; background: #222; color: white; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="header">🎬 TMX KURDISH ENTERTAINMENT</div>

    <div id="login-screen" style="padding: 60px 20px;">
        <h1 style="color: var(--tmx-green); font-size: 40px;">TMX KURDISH</h1>
        <input type="text" id="p-name" placeholder="ناوەکەت بنووسە..."><br>
        <button class="btn" onclick="initUser()">دەستپێکردن</button>
    </div>

    <div id="main-ui" style="display: none;">
        <div class="tab-bar">
            <div class="tab active" id="tab-domino" onclick="showTab('domino')">🀄 دۆمینە</div>
            <div class="tab" id="tab-konkan" onclick="showTab('konkan')">🃏 کۆنکان</div>
            <div class="tab" id="tab-top" onclick="showTab('top')">🏆 TOP 50</div>
        </div>

        <div id="domino" class="game-container active">
            <h2 style="color: var(--tmx-green);">مێزی دۆمینە</h2>
            <div id="domino-display" style="background:#074a21; border:5px solid #5d4037; border-radius:15px; padding:40px; margin:20px auto; max-width:350px;">
                <p id="domino-msg">بەردێک ڕابکێشە</p>
            </div>
            <button class="btn" onclick="playDomino()">🎲 ڕاکێشانی بەرد</button>
        </div>

        <div id="konkan" class="game-container">
            <h2 style="color: #4a69bd;">مێزی کۆنکان</h2>
            <div style="background:#1e3799; border:5px solid #0c2461; border-radius:15px; padding:40px; margin:20px auto; max-width:350px;">
                <p>کارتەکان لێرە دەردەکەون</p>
            </div>
            <button class="btn" style="background:#ff4757">🔀 دابەشکردن</button>
        </div>

        <div id="top" class="game-container">
            <h2 style="color: var(--tmx-gold);">🏆 ڕیزبەندی TOP 50</h2>
            <div id="leaderboard-content"></div>
        </div>
    </div>

    <script>
        // دڵنیابوون لەوەی Firebase بە دروستی جێگیر کراوە
        const firebaseConfig = { databaseURL: "https://tmx-kurdish-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = "";
        let currentScore = 0;

        // ئەم فەنکشنە چاککراوە تاوەکو یەکسەر ئیش بکات
        function initUser() {
            let inputName = document.getElementById('p-name').value.trim();
            if (inputName.length < 2) {
                alert("تکایە ناوێک بنووسە!");
                return;
            }
            currentUser = inputName;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
            
            // هەوڵدان بۆ هێنانی خاڵی پێشوو لە سێرڤەرەوە
            database.ref('players/' + currentUser).once('value').then((s) => {
                if(s.exists()) { currentScore = s.val().score; }
            }).catch(e => console.log("سێرڤەر هێشتا ئامادە نییە، بەڵام یاری بکە."));
        }

        function showTab(id) {
            document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('tab-' + id).classList.add('active');
            if(id === 'top') loadTopData();
        }

        function playDomino() {
            let p1 = Math.floor(Math.random() * 7);
            let p2 = Math.floor(Math.random() * 7);
            document.getElementById('domino-display').innerHTML = `
                <div style="background:white; color:black; padding:15px; display:inline-block; border-radius:8px; font-weight:bold; font-size:25px; border:2px solid #000;">
                    ${p1} | ${p2}
                </div>
                <p style="color:var(--tmx-gold); margin-top:10px;">+10 خاڵ!</p>
            `;
            currentScore += 10;
            // پاشەکەوتکردن لە Firebase
            database.ref('players/' + currentUser).set({ name: currentUser, score: currentScore });
        }

        function loadTopData() {
            const list = document.getElementById('leaderboard-content');
            list.innerHTML = "<p>⌛ خەریکە خاڵەکان دەهێنم...</p>";
            
            database.ref('players').orderByChild('score').limitToLast(50).on('value', (snapshot) => {
                let html = "";
                let arr = [];
                snapshot.forEach(child => arr.push(child.val()));
                arr.reverse().forEach((p, i) => {
                    let medal = (i === 0) ? "🥇" : (i === 1) ? "🥈" : (i === 2) ? "🥉" : "👤";
                    html += `
                        <div class="score-box">
                            <span>${medal} ${i+1}. <b>${p.name}</b></span>
                            <span style="color: var(--tmx-gold); font-weight: bold;">${p.score} ⭐</span>
                        </div>`;
                });
                list.innerHTML = html;
            });
        }
    </script>
</body>
</html>
