<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX KURDISH | پلاتفۆرمی یاری ئۆنلاین</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        :root { --tmx-green: #1db954; --tmx-red: #ff0000; --tmx-gold: #ffd700; }
        body { background-color: #0c0c0c; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; margin: 0; overflow-x: hidden; }
        
        /* Header & Tabs */
        .header { background-color: var(--tmx-red); padding: 15px; font-size: 22px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .tab-bar { display: flex; justify-content: space-around; background: #1a1a1a; padding: 12px; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #333; }
        .tab { cursor: pointer; color: #888; font-weight: bold; transition: 0.3s; font-size: 14px; }
        .tab.active { color: var(--tmx-green); border-bottom: 2px solid var(--tmx-green); transform: scale(1.1); }

        /* Game Containers */
        .game-container { display: none; padding: 20px; animation: fadeIn 0.5s; }
        .game-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Domino Table */
        .domino-table { background: #074a21; border: 8px solid #5d4037; border-radius: 20px; min-height: 250px; margin: 20px auto; max-width: 450px; position: relative; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .stone { background: white; color: black; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 22px; margin: 8px; border: 2px solid #000; box-shadow: 3px 3px 5px rgba(0,0,0,0.3); display: inline-block; }

        /* Konkan Table */
        .konkan-table { background: #1e3799; border: 8px solid #0c2461; border-radius: 20px; padding: 40px; margin: 20px auto; max-width: 450px; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); }
        
        /* UI Elements */
        .btn { background-color: var(--tmx-green); color: white; padding: 14px 28px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; margin: 10px; transition: 0.3s; font-size: 16px; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(29, 185, 84, 0.4); }
        .score-box { background: #222; margin: 8px auto; padding: 15px; border-radius: 12px; border-right: 5px solid var(--tmx-green); display: flex; justify-content: space-between; align-items: center; max-width: 400px; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; width: 80%; max-width: 300px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
