<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>TMX MEGA OS | BINER EDITION</title>
    <style>
        :root { --neon: #00ff41; --bg: #000; }
        body { margin: 0; background: #000; color: var(--neon); font-family: monospace; overflow: hidden; }
        #matrix { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }
        .desktop { width: 100%; height: 95vh; padding: 30px; position: relative; }
        .icon { width: 100px; text-align: center; cursor: pointer; margin-bottom: 30px; transition: 0.3s; }
        .icon:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px var(--neon)); }
        .win { position: absolute; width: 85%; height: 80%; background: rgba(0,10,0,0.95); border: 2px solid var(--neon); border-radius: 10px; display: none; flex-direction: column; top: 5%; left: 7.5%; box-shadow: 0 0 50px rgba(0,255,0,0.3); backdrop-filter: blur(10px); }
        .win-head { background: rgba(0,255,0,0.1); padding: 10px; border-bottom: 1px solid var(--neon); display: flex; justify-content: space-between; }
        .win-body { flex: 1; padding: 25px; overflow-y: auto; text-align: left; direction: ltr; }
        .taskbar { position: fixed; bottom: 0; width: 100%; height: 45px; background: #000; border-top: 1px solid var(--neon); display: flex; align-items: center; padding: 0 20px; }
        .script-card { background: rgba(0,255,0,0.05); border: 1px solid #1a1a1a; padding: 15px; margin: 10px; border-radius: 5px; border-right: 4px solid gold; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="desktop">
        <div class="icon" onclick="openWin('bible')"> <div style="font-size:50px">📚</div> <span>100_Pages_Scripts</span> </div>
        <div class="icon" onclick="accessOffice()"> <div style="font-size:50px">🔐</div> <span>Biner_Private_Office</span> </div>

        <div id="bible" class="win">
            <div class="win-head"> <span>TMX_SCRIPT_ARCHIVE_V5.sys</span> <span style="color:red; cursor:pointer" onclick="closeWin('bible')">✕</span> </div>
            <div class="win-body" id="bible-content"></div>
        </div>

        <div id="office" class="win">
            <div class="win-head"> <span>BINER_OFFICE_ULTRA_SECURE</span> <span style="color:red; cursor:pointer" onclick="closeWin('office')">✕</span> </div>
            <div class="win-body" id="office-content">
                <h1 style="text-align:center; color:gold;">⭐ گەنجینەی تایبەتی فەرماندە ⭐</h1>
                <div id="vip-list" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;"></div>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div style="background:var(--neon); color:#000; padding:5px 15px; font-weight:bold;">TMX START</div>
        <div id="clock" style="margin-right:auto">00:00:00</div>
    </div>

    <script>
        // ١. سیستەمی پاسوۆرد بۆ ئۆفیس
        function accessOffice() {
            let p = prompt("Enter Commander Key:");
            if(p === "BINER_2026") { openWin('office'); loadVIP(); }
            else { alert("ACCESS DENIED!"); }
        }

        // ٢. دروستکردنی ١٠٠ پەیجی فێربوون
        const b = document.getElementById('bible-content');
        for(let i=1; i<=100; i++) {
            b.innerHTML += `<div class="script-card"><b style="color:#fff">PAGE_${i}:</b> <code>pkg install tmx-tool-${i}</code><br><small>تایبەت بە فێربوونی بەشی ${i}</small></div>`;
        }

        // ٣. بارکردنی هەزارەها سکرێپت لە ئۆفیسدا
        function loadVIP() {
            const v = document.getElementById('vip-list');
            v.innerHTML = "";
            let frag = document.createDocumentFragment();
            for(let j=1; j<=1500; j++) {
                let d = document.createElement('div');
                d.className = 'script-card';
                d.innerHTML = `<b>VIP_TOOL_${j}</b><br><code>git clone tmx/id-${j}</code>`;
                frag.appendChild(d);
            }
            v.appendChild(frag);
        }

        // ٤. ماتریکس و کاتژمێر
        const c = document.getElementById('matrix');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const chars = "01TMXBINER";
        const drops = Array(Math.floor(c.width/20)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = "#0f0"; drops.forEach((y, i) => {
                ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*20, y*20);
                if(y*20 > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        function openWin(id) { document.getElementById(id).style.display = 'flex'; }
        function closeWin(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
