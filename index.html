<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX KURDISH | یارییەکان</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0c0c0c; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .header { background-color: #ff0000; padding: 15px; font-size: 20px; font-weight: bold; }
        .tab-bar { display: flex; justify-content: space-around; background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; }
        .tab { cursor: pointer; color: #888; font-weight: bold; }
        .tab.active { color: #1db954; border-bottom: 2px solid #1db954; }
        .game-container { display: none; padding: 20px; }
        .game-container.active { display: block; }
        .domino-table { background: #074a21; border: 10px solid #5d4037; border-radius: 20px; height: 300px; position: relative; margin: 20px auto; max-width: 400px; }
        .stone { background: white; color: black; padding: 10px; border-radius: 5px; font-weight: bold; display: inline-block; margin: 5px; border: 2px solid #000; }
        .btn { background-color: #1db954; color: white; padding: 12px 25px; border-radius: 5px; border: none; cursor: pointer; margin: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">🎬 TMX KURDISH PLATFORM</div>

    <div class="tab-bar">
        <div class="tab active" onclick="showTab('domino')">🀄 دۆمینە</div>
        <div class="tab" onclick="showTab('konkan')">🃏 کۆنکان</div>
        <div class="tab" onclick="showTab('top')">🏆 TOP 50</div>
    </div>

    <div id="domino" class="game-container active">
        <h2 style="color: #1db954;">مێزی دۆمینەی TMX</h2>
        <div class="domino-table" id="table">
            <p id="status-msg">چاوەڕێی یاریزان بکە یان دژی بۆت یاری بکە</p>
            <div id="stones-on-table"></div>
        </div>
        <button class="btn" onclick="startBotMatch()">🤖 یاری دژی بۆت</button>
        <button class="btn" style="background: #3498db;" onclick="scanPlayers()">🔍 گەڕان بۆ یاریزان (Scan)</button>
    </div>

    <div id="konkan" class="game-container">
        <h2>یاری کۆنکانی کوردی</h2>
        <p>ئەم بەشە لە وەشانی داهاتوودا چالاک دەبێت...</p>
        <div style="font-size: 50px;">🃏</div>
    </div>

    <div id="top" class="game-container">
        <h2 style="color: gold;">ڕیزبەندی TOP 50</h2>
        <div id="leaderboard-list">بارگاوی دەبێتەوە...</div>
    </div>

    <script>
        // بەستنەوەی فەرمی بە سێرڤەرەکەتەوە
        const firebaseConfig = { databaseURL: "https://tmx-kurdish-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function showTab(tabId) {
            document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            if(tabId === 'top') loadTop50();
        }

        // سیستەمی یاری دژی بۆت
        function startBotMatch() {
            document.getElementById('status-msg').innerText = "یاری دەستی پێکرد!";
            let p1 = Math.floor(Math.random() * 7);
            let p2 = Math.floor(Math.random() * 7);
            document.getElementById('stones-on-table').innerHTML = `<div class="stone">${p1} | ${p2}</div>`;
            alert("فەرماندە، بەردی یەکەمت دانا! ئێستا نۆرەی بۆتەکەیە.");
        }

        function scanPlayers() {
            document.getElementById('status-msg').innerText = "خەریکی گەڕانە بۆ یاریزان (Scanning)...";
            setTimeout(() => {
                alert("کەس نەدۆزرایەوە! باشترە دژی بۆت یاری بکەیت.");
                document.getElementById('status-msg').innerText = "کەس ئۆنلاین نییە.";
            }, 3000);
        }

        function loadTop50() {
            database.ref('players').orderByChild('score').limitToLast(50).on('value', (snapshot) => {
                let html = "";
                snapshot.forEach(child => {
                    let p = child.val();
                    html += `<div style="padding:10px; border-bottom:1px solid #333;">${p.name} - ${p.score} pt</div>`;
                });
                document.getElementById('leaderboard-list').innerHTML = html;
            });
        }
    </script>
</body>
</html>
