<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX KURDISH PLATFORM</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body>
    <div class="header">🎬 TMX KURDISH ENTERTAINMENT</div>

    <div id="login-screen" style="padding: 80px 20px;">
        <input type="text" id="p-name" placeholder="ناوەکەت بنووسە..."><br>
        <button class="btn" onclick="initUser()">🔐 دەستپێکردن</button>
    </div>

    <div id="main-ui" style="display: none;">
        <div class="tab-bar">
            <div class="tab active" onclick="showTab('domino')">🀄 دۆمینە</div>
            <div class="tab" onclick="showTab('konkan')">🃏 کۆنکان</div>
            <div class="tab" onclick="showTab('top')">🏆 TOP 50</div>
        </div>

        <div id="domino" class="game-container active">
            <div class="table-ui" id="domino-display" style="background:#074a21; border:5px solid #5d4037;"></div>
            <button class="btn" onclick="playDomino()">🎲 ڕاکێشانی بەرد</button>
        </div>

        <div id="konkan" class="game-container">
            <div class="table-ui" id="konkan-display" style="background:#1e3799; border:5px solid #0c2461;"></div>
            <button class="btn" style="background:#ff4757" onclick="startKonkan()">🔀 دابەشکردن</button>
        </div>

        <div id="top" class="game-container">
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <script>
        // داتابەیس و فەنکشنی سەرەکی
        const firebaseConfig = { databaseURL: "https://tmx-kurdish-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let currentUser = "", currentScore = 0;

        function initUser() {
            currentUser = document.getElementById('p-name').value;
            if(currentUser.length < 2) return alert("ناوێک بنووسە");
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
        }

        function updateScore(pts) {
            currentScore += pts;
            database.ref('players/' + currentUser).set({ name: currentUser, score: currentScore });
        }

        function showTab(id) {
            document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'top') loadTop();
        }

        function loadTop() {
            database.ref('players').orderByChild('score').limitToLast(50).on('value', s => {
                let html = "";
                let arr = [];
                s.forEach(c => arr.push(c.val()));
                arr.reverse().forEach((p, i) => {
                    html += `<div class="score-box"><span>${i+1}. ${p.name}</span><span>${p.score} ⭐</span></div>`;
                });
                document.getElementById('leaderboard-list').innerHTML = html;
            });
        }
    </script>
    <script src="domino.js"></script>
    <script src="konkan.js"></script>
</body>
</html>
