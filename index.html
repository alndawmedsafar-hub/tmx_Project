<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMX CINEMA | BENAR MOVIES</title>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; background: #e50914; padding: 15px 0; text-align: center; font-size: 20px; font-weight: bold; }
        
        .main-container {
            width: 95%;
            max-width: 800px;
            margin: 20px auto;
            position: relative;
        }

        .video-box {
            width: 100%;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 🚩 لۆگۆکە هێنراوەتە ناوەوە تا لە شاشە دەرنەچێت */
        .tmx-logo {
            position: absolute !important;
            top: 45px !important;    /* 👈 هێناومەتە خوارەوە تا نەچێتە دەرەوەی شاشە */
            left: 15px !important;   /* 👈 کەمێک هێناومەتە ناوەوە */
            width: 60px !important;  /* قەبارەی گونجاو */
            height: auto;
            z-index: 999999 !important;
            pointer-events: none;
        }

        .details { background: #111; padding: 20px; margin-top: 15px; border-radius: 8px; text-align: right; border-right: 4px solid #e50914; }
        h1 { color: #f1c40f; font-size: 18px; }
        p { color: #bbb; font-size: 14px; }
    </style>
</head>
<body>

    <header>🍿 TMX TERMINAL CINEMA</header>

    <div class="main-container">
        <img src="Screenshot_20260409_145229_com.android_chrome_DownloadActivity.png" class="tmx-logo" alt="BENAR">

        <div class="video-box">
            <iframe src="https://drive.google.com/file/d/1Gku45kUBjEAUtOiy5h5FGQvR1uSokUz3/preview" allow="autoplay; fullscreen"></iframe>
        </div>

        <div class="details">
            <h1>The Skeleton's Compass 🎬</h1>
            <p>بەخێربێن بۆ سینەمای BENAR MOVIES.</p>
        </div>
    </div>

</body>
</html>
